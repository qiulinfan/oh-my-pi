# Builds this fork's Windows omp.exe and publishes it as a GitHub Release, so a
# Windows machine installs the fork by downloading it instead of compiling it.
# Every upstream workflow is removed from this fork; this is the only one.
name: Fork Windows omp

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-windows-omp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # windows-2022 ships Visual Studio 2022's MSVC tools; the native addon builds
    # through cargo for the host (packages/natives/scripts/build-bindings.ts), not Bazel.
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Show the toolchain
        shell: pwsh
        run: |
          bun --version
          rustup show active-toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the native addon
        run: bun run build:native

      - name: Build omp.exe
        run: bun --cwd=packages/coding-agent run build

      - name: Smoke the binary
        shell: pwsh
        run: |
          $binary = 'packages/coding-agent/dist/omp.exe'
          $runtimeDir = Join-Path $env:RUNNER_TEMP 'omp-smoke'
          $env:HOME = Join-Path $runtimeDir 'home'
          $env:USERPROFILE = $env:HOME
          $env:LOCALAPPDATA = Join-Path $runtimeDir 'local'
          $env:XDG_DATA_HOME = Join-Path $runtimeDir 'xdg'
          New-Item -ItemType Directory -Force -Path $env:HOME, $env:LOCALAPPDATA, $env:XDG_DATA_HOME | Out-Null
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage the release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item packages/coding-agent/dist/omp.exe release/omp-windows-x64.exe
          $hash = (Get-FileHash release/omp-windows-x64.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path release/omp-windows-x64.exe.sha256 -Value "$hash  omp-windows-x64.exe" -NoNewline -Encoding ascii

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content packages/coding-agent/package.json -Raw | ConvertFrom-Json).version
          $sha = $env:GITHUB_SHA.Substring(0, 10)
          $tag = "fork-v$version-$sha"
          $notes = "Windows build of qiulinfan/oh-my-pi main at $env:GITHUB_SHA (omp $version). update-forks installs omp-windows-x64.exe after checking it against omp-windows-x64.exe.sha256."
          gh release create $tag release/omp-windows-x64.exe release/omp-windows-x64.exe.sha256 `
            --target $env:GITHUB_SHA --title "omp $version (fork, $sha)" --notes $notes --latest

      - name: Keep the binary as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omp-windows-x64
          path: release/
          if-no-files-found: ignore
          retention-days: 14
