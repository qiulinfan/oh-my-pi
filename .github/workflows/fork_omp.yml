# Builds this fork's omp for macOS (arm64), Windows (omp.exe) and Linux (for WSL)
# and publishes them in one GitHub Release, which `omp update` and the startup
# check install from (src/cli/fork-release.ts). Every upstream workflow is
# removed from this fork; this is the only one.
name: Fork omp

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-omp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # windows-2022 ships Visual Studio 2022's MSVC tools.
          - { os: windows-2022, binary: omp.exe, asset: omp-windows-x64.exe }
          # ubuntu-22.04's glibc 2.35 keeps the binary runnable on newer distributions such as WSL's.
          - { os: ubuntu-22.04, binary: omp, asset: omp-linux-x64 }
          # macos-15 is Apple silicon; build-binary.ts signs the binary ad hoc.
          - { os: macos-15, binary: omp, asset: omp-darwin-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Show the toolchain
        shell: bash
        run: |
          bun --version
          rustup show active-toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The native addon builds through cargo for the host
      # (packages/natives/scripts/build-bindings.ts), not Bazel.
      - name: Build the native addon
        run: bun run build:native

      - name: Build omp
        run: bun --cwd=packages/coding-agent run build

      - name: Check GUI host transport
        run: bun test packages/coding-agent/test/gui-terminal-process.test.ts packages/coding-agent/test/gui-open-link.test.ts packages/coding-agent/test/gui-settings-api.test.ts desktop/test/windows-client.test.ts

      - name: Test Windows release updates
        if: runner.os == 'Windows'
        run: >-
          bun test packages/coding-agent/test/update-windows-native.test.ts
          packages/coding-agent/test/fork-release.test.ts packages/coding-agent/test/cli/update-cli.test.ts
          packages/coding-agent/test/protocol-fork-update.test.ts packages/coding-agent/test/acp-stdout-hygiene.test.ts

      - name: Check GUI settings round trip
        run: bun test packages/coding-agent/test/gui-server.test.ts --test-name-pattern "Settings page|work-detail mode picked|End stops omp as|recorded pid is signalled"

      - name: Smoke the binary
        shell: bash
        run: |
          binary="packages/coding-agent/dist/${{ matrix.binary }}"
          runtime="$RUNNER_TEMP/omp-smoke"
          mkdir -p "$runtime/home" "$runtime/local" "$runtime/xdg"
          export HOME="$runtime/home" USERPROFILE="$runtime/home" LOCALAPPDATA="$runtime/local" XDG_DATA_HOME="$runtime/xdg"
          "$binary" --version
          "$binary" --smoke-test

      - name: Stage the release asset
        shell: bash
        run: |
          mkdir -p release
          cp "packages/coding-agent/dist/${{ matrix.binary }}" "release/${{ matrix.asset }}"
          cd release
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version packages/coding-agent/package.json)"
          sha="${GITHUB_SHA:0:10}"
          tag="fork-v$version-$sha"
          notes="Builds of qiulinfan/oh-my-pi main at $GITHUB_SHA (omp $version): omp-darwin-arm64 for macOS, omp-windows-x64.exe for Windows and omp-linux-x64 for WSL. omp update installs this platform's binary after checking it against its .sha256."
          gh release create "$tag" release/* -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "omp $version (fork, $sha)" --notes "$notes" --latest
